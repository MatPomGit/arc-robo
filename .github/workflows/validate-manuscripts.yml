name: ARC Robo - structural and LaTeX checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check ARC repository contract
        run: python3 scripts/validate_repository.py --phase scaffold
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit v2 migration inventory without modifying registries
        run: python3 -B scripts/migration_preflight.py
      - name: Validate curated Pages and optional programme logo
        run: |
          set -euo pipefail
          python3 scripts/site_branding.py
          python3 scripts/validate_pages.py
          python3 scripts/build_public_catalog.py
          git diff --exit-code -- pages/projects.md
      - name: Build isolated public MkDocs site
        run: |
          python3 -m pip install --disable-pip-version-check mkdocs==1.6.1
          python3 -m mkdocs build --strict --clean

  latex-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal LaTeX build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends latexmk lmodern texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-lang-polish
      - name: Compile every new prospective manuscript
        run: |
          set -euo pipefail
          count=0
          for f in manuscripts/MSC-*/main.tex; do
            latexmk -pdf -cd -interaction=nonstopmode -halt-on-error "$f"
            count=$((count + 1))
          done
          test "$count" -eq 32
          echo "Compiled $count manuscript plans."

  pages-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Validate curated Pages source and allowlist
        run: python3 -B scripts/validate_pages.py
      - name: Build curated Pages offline without deployment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/arc-robo-pages"
          "$RUNNER_TEMP/arc-robo-pages/bin/python" -m pip install --disable-pip-version-check mkdocs==1.6.1
          "$RUNNER_TEMP/arc-robo-pages/bin/python" -m mkdocs build --strict --clean
          test -f site/index.html
          test -f site/projects/index.html
